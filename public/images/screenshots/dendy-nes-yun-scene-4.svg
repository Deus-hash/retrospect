<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="crt-bg-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b000a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>
    <pattern id="scanlines" width="320" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="320" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- CRT Monitor Frame -->
  <rect width="320" height="240" fill="url(#crt-bg-3)"/>
  <rect x="6" y="6" width="308" height="228" rx="8" fill="none" stroke="#e53935" stroke-width="2"/>
  
  <!-- Arcade HUD Header -->
  <rect x="8" y="8" width="304" height="24" fill="rgba(0,0,0,0.7)"/>
  <text x="16" y="24" fill="#ffff55" font-family="monospace" font-size="10" font-weight="bold">SCORE:158200</text>
  <text x="170" y="24" fill="#ff3344" font-family="monospace" font-size="9" font-weight="bold">STAGE:03</text>
  <text x="304" y="24" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="end">NES 8-BIT</text>

  <!-- Scene Elements -->
  
      <polygon points="130,80 190,80 180,130 140,130" fill="#ff1744" opacity="0.7"/>
      <text x="160" y="160" fill="#ff3344" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BOSS ENCOUNTER</text>
    

  <!-- CRT Scanlines Overlay -->
  <rect width="320" height="240" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Footer Info Bar -->
  <rect x="8" y="204" width="304" height="26" fill="rgba(0,0,0,0.85)"/>
  <text x="160" y="221" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Yun</text>
  <text x="16" y="221" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="8">2016</text>
  <text x="304" y="221" fill="#ff3344" font-family="monospace" font-size="8" text-anchor="end">Приключенч</text>
</svg>